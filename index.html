<!doctype html><html><head>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sherik">
<link rel="manifest" href="manifest.json">
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sherik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell. Coloured light drifts behind frosted glass panes;
   a floating glass tab bar on phones turns into a side rail on desktop. */
:root{
  --bg:#E8EEF2; --ink:#0D1A24; --ink2:#4C5D6A; --ink3:#8394A1;
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.82); --glass-hi:rgba(255,255,255,.9);
  --line:rgba(255,255,255,.75); --hair:rgba(13,26,36,.09); --field:rgba(255,255,255,.6);
  --shade:rgba(30,50,70,.14);
  --accent:#F04A24; --accent2:#FF8A4C; --on-accent:#fff; --accent-soft:rgba(240,74,36,.12);
  --teal:#0A9C8F; --sky:#2F7BF0; --ok:#178F5F; --ok-soft:rgba(23,143,95,.14); --danger:#D93A3F;
  --b1:#FFB39A; --b2:#86E0D2; --b3:#A8C6FF;
  --map-land:#E6ECEB; --map-road:#FFFFFF; --map-road2:rgba(255,255,255,.75); --map-water:#A9D3F2; --map-park:#BFE3C4; --map-label:#5B6C78;
  --bubble:rgba(255,255,255,.8);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --r-sm:14px; --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#091018; --ink:#F0F5F8; --ink2:#A9B7C2; --ink3:#71818D;
  --glass:rgba(30,42,54,.56); --glass-strong:rgba(32,44,56,.86); --glass-hi:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.13); --hair:rgba(255,255,255,.09); --field:rgba(255,255,255,.07);
  --shade:rgba(0,0,0,.4);
  --accent:#FF6A45; --accent2:#FF9A5C; --on-accent:#1A0A05; --accent-soft:rgba(255,106,69,.16);
  --teal:#35CBBB; --sky:#6BA6FF; --ok:#4AD29A; --ok-soft:rgba(74,210,154,.15); --danger:#FF6B6F;
  --b1:#8A2E17; --b2:#0A6158; --b3:#1D4594;
  --map-land:#141D26; --map-road:#2A3846; --map-road2:rgba(255,255,255,.06); --map-water:#17405F; --map-park:#173A2C; --map-label:#8FA0AD;
  --bubble:rgba(44,58,72,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#091018; --ink:#F0F5F8; --ink2:#A9B7C2; --ink3:#71818D;
  --glass:rgba(30,42,54,.56); --glass-strong:rgba(32,44,56,.86); --glass-hi:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.13); --hair:rgba(255,255,255,.09); --field:rgba(255,255,255,.07);
  --shade:rgba(0,0,0,.4);
  --accent:#FF6A45; --accent2:#FF9A5C; --on-accent:#1A0A05; --accent-soft:rgba(255,106,69,.16);
  --teal:#35CBBB; --sky:#6BA6FF; --ok:#4AD29A; --ok-soft:rgba(74,210,154,.15); --danger:#FF6B6F;
  --b1:#8A2E17; --b2:#0A6158; --b3:#1D4594;
  --map-land:#141D26; --map-road:#2A3846; --map-road2:rgba(255,255,255,.06); --map-water:#17405F; --map-park:#173A2C; --map-label:#8FA0AD;
  --bubble:rgba(44,58,72,.85); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
.ic{flex:none}

#app{height:100%;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-28vmax;background:var(--b1);animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-28vmax;top:22%;background:var(--b2);animation:drift 32s ease-in-out infinite alternate-reverse}
.bg i:nth-child(3){width:64vmax;height:64vmax;left:-10vmax;bottom:-36vmax;background:var(--b3);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-block:14px 28px;-webkit-overflow-scrolling:touch}
.has-tabs #view{padding-bottom:calc(112px + var(--sab))}
#view.flush{padding:0;overflow:hidden}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 34px var(--shade);border-radius:var(--r)}

.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.4}
.agree input{width:20px;height:20px;margin-top:1px;flex:none}
.agree .link{color:var(--sky);text-decoration:underline;font-size:inherit}
.tipbox{font-size:13px;color:var(--ink2);padding:10px 12px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--hair)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15.5px;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px var(--accent-soft)}
.btn.sec{background:var(--glass-strong);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.ghost{color:var(--ink2)}
.btn.danger{color:var(--danger);background:var(--field);border:1px solid var(--hair)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.inp{width:100%;min-height:50px;padding:12px 16px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--hair);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--sky)}
.inp::placeholder{color:var(--ink3)}
textarea.inp{resize:vertical;min-height:84px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:50px;border-radius:999px;color:var(--ink2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;height:48px}

/* chips */
.row{display:flex;gap:8px;align-items:center}
.scroll-x{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:500;font-size:14px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--hair)}
.seg button{flex:1;min-height:38px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px var(--shade)}

/* headers */
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.top h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{font-size:17px;font-weight:700}
.sec-h>button{color:var(--accent);font-weight:600;font-size:14px}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink3)}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;background:var(--c,#789);border:2px solid var(--glass-strong)}
.av.lg{width:84px;height:84px;font-size:28px;border-width:3px}
.av.sm{width:28px;height:28px;font-size:11px}
.stack{display:flex}.stack .av+.av{margin-left:-9px}

/* event card */
.cards{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px;text-align:left;width:100%}
.ev .tile,.tile{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:27px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.ev h4{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--ink2)}
.meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.ev .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--field);color:var(--ink3)}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* map */
.mapv{position:relative;overflow:hidden;background:var(--map-land);touch-action:none;user-select:none}
.mapv.still{touch-action:auto}
.mapv canvas{position:absolute;inset:0;width:100%;height:100%}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:0;height:0}
.pin-b{position:absolute;left:-21px;top:-52px;width:42px;height:42px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--glass-strong);border:2.5px solid var(--c);box-shadow:0 6px 14px var(--shade);display:grid;place-items:center;pointer-events:auto;transition:scale .18s}
.pin-b span{transform:rotate(45deg);font-size:19px;line-height:1}
.pin-b b{position:absolute;right:-9px;top:-9px;transform:rotate(45deg);min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--c);color:#fff;font-size:11px;display:grid;place-items:center}
.pin.sel .pin-b{scale:1.25;z-index:2}
.still .pin-b{pointer-events:none}
.me-dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 0 var(--sky);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.map-ctl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.map-ctl button{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.center-pin{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none;transform:translate(-50%,-100%);color:var(--accent);filter:drop-shadow(0 6px 6px var(--shade))}
.mini-map{height:190px;border-radius:var(--r);display:block;width:100%;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 34px var(--shade)}
.mini-map .mapv{position:absolute;inset:0}
.mini-map .tag{position:absolute;left:10px;bottom:10px;z-index:3;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.page-map{position:absolute;inset:0}
.page-map>.mapv{position:absolute;inset:0}
.map-top{position:absolute;left:16px;right:16px;top:14px;z-index:4;display:flex;flex-direction:column;gap:10px;max-width:560px;margin-inline:auto}
.results{padding:6px;display:flex;flex-direction:column;max-height:46vh;overflow:auto}
.results button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;min-height:48px}
.results button:hover{background:var(--field)}
.results b{display:block;font-weight:600}
.map-card{position:absolute;left:16px;right:16px;bottom:calc(104px + var(--sab));z-index:4;max-width:560px;margin-inline:auto}
.map-note{position:absolute;left:12px;bottom:calc(100px + var(--sab));z-index:2;font-size:11px;color:var(--map-label)}
.picker{height:230px;border-radius:var(--r-sm);position:relative;overflow:hidden;border:1px solid var(--hair)}
.picker .mapv{position:absolute;inset:0}
.picked{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--hair)}

/* tab bar */
#tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));z-index:20;display:flex;align-items:center;gap:2px;padding:7px;border-radius:999px;width:min(calc(100% - 32px),420px);justify-content:space-between}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--ink3)}
#tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#tabbar .add{flex:none;width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px var(--accent-soft);margin-inline:4px}

/* welcome / auth */
.hero{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.brand i{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:var(--on-accent);font-style:normal}
.hero h1{font-size:clamp(30px,8.6vw,44px);line-height:1.08}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:16.5px;color:var(--ink2);max-width:36ch}
.demo-stack{position:relative;display:flex;flex-direction:column;gap:10px}
.demo-stack .ev:nth-child(2){margin-left:22px;margin-right:-6px;opacity:.9}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.steps div{padding:14px 12px;border-radius:var(--r-sm);font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.steps b{color:var(--ink);font-size:14px}
.form{padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.link{color:var(--accent);font-weight:600}
.err{color:var(--danger);font-size:13.5px;font-weight:500}

/* detail */
.d-head{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.d-head h1{font-size:23px;line-height:1.15}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{padding:12px 14px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--hair);min-width:0}
.fact small{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:12px;font-weight:600}
.fact b{display:block;font-size:15px;margin-top:3px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:9px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--ok))}
.people{display:flex;flex-direction:column}
.people li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.people li:last-child{border:0}
ul{list-style:none;margin:0;padding:0}
.sticky-act{position:sticky;bottom:calc(8px + var(--sab));display:flex;gap:10px;padding:10px;border-radius:999px;z-index:5}
.sticky-act .btn{flex:1}

/* chat */
.room{height:100%;display:flex;flex-direction:column;max-width:760px;margin-inline:auto}
.room-top{margin:12px 16px 0;padding:8px 14px 8px 6px;display:flex;align-items:center;gap:8px;border-radius:999px;z-index:2}
.room-top .t{min-width:0;flex:1}.room-top b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg .who{font-size:12px;font-weight:600;color:var(--ink3);padding-left:12px}
.msg .bub{padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--bubble);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end}
.msg.me .bub{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);border-color:transparent;border-radius:20px 20px 6px 20px}
.msg time{font-size:11px;color:var(--ink3);padding-inline:12px}
.msg.me time{text-align:right}
.msg .ev{margin-top:4px;padding:10px;grid-template-columns:44px 1fr;gap:10px}
.msg .ev .tile{width:44px;height:44px;font-size:21px;border-radius:14px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px)}}
.quick{padding:0 16px 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.composer{margin:0 16px calc(12px + var(--sab));padding:6px 6px 6px 18px;display:flex;align-items:center;gap:8px;border-radius:999px}
.composer input{flex:1;min-width:0;background:none;border:0;outline:none;height:44px}
.composer button{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--on-accent);display:grid;place-items:center;flex:none}
.chat-row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.chat-row .t{flex:1;min-width:0}
.chat-row p{color:var(--ink2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(135deg,var(--teal),var(--sky));flex:none}
.ai-banner{display:flex;gap:14px;align-items:center;padding:14px;text-align:left;width:100%}
.ai-banner .t{flex:1;min-width:0}

/* profile */
.p-head{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.p-head h1{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:6px}
.stats div{padding:12px 6px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--hair)}
.stats b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink2)}
.menu{padding:6px}
.menu>button,.menu>.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:16px;text-align:left;min-height:52px}
.menu>button:hover{background:var(--field)}
.menu .g{flex:1;min-width:0;font-weight:500}
.menu .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--field);color:var(--ink2);flex:none}
.stepper{display:flex;align-items:center;gap:6px;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--hair);align-self:flex-start}
.stepper b{min-width:44px;text-align:center;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.stepper button{width:42px;height:42px;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center}
.stars{color:#E8A100;display:inline-flex}

/* sheet & toast */
#sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,12,18,.35)}
#sheet .panel{width:100%;max-width:520px;margin:0 8px calc(8px + var(--sab));padding:22px 18px;display:flex;flex-direction:column;gap:14px;background:var(--glass-strong);animation:up .28s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h3{font-family:var(--display);font-size:19px}
.gps-ill{width:76px;height:76px;border-radius:26px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);align-self:center}
#toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;background:var(--glass-strong);animation:rise .25s both}

@media (min-width:900px){
  #tabbar{left:22px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;width:84px;border-radius:32px;gap:6px;padding:10px 8px}
  #tabbar button{width:100%;flex:none;min-height:60px;border-radius:22px}
  #tabbar .add{width:56px;margin:6px 0}
  .has-tabs #view{padding-left:128px;padding-bottom:28px}
  .has-tabs #view.flush{padding-left:0}
  .wrap{max-width:640px}
  .wrap.wide{max-width:1120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:24px}
  .wrap.wide .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .wrap.wide .side{position:sticky;top:0}
  .wrap.wide .mini-map{height:min(70vh,620px)}
  .map-top{left:130px;margin-inline:0}
  .map-card{left:130px;margin-inline:0;bottom:24px}

  .wrap.welcome{max-width:980px;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100% - 20px)}
}
@media (max-width:899px){.wrap.wide .col{display:contents}.wrap.wide .side{order:3}.wrap.wide .feed-h{order:4}.wrap.wide #feed{order:5}}

const PLACES=[
 ['Yunusobod','tuman',41.3647,69.2885],['Chilonzor','tuman',41.2756,69.2034],["Mirzo Ulug'bek",'tuman',41.3385,69.3347],

 ['Shayxontohur','tuman',41.3240,69.2300],['Mirobod','tuman',41.2880,69.2850],['Yakkasaroy','tuman',41.2850,69.2500],
 ['Yunusobod tennis korti','sport',41.3585,69.2860],['Yunusobod sport majmuasi','sport',41.3690,69.2950],
 ['Paxtakor stadioni','sport',41.3169,69.2630],['Bunyodkor stadioni','sport',41.2797,69.2123],['Humo Arena','sport',41.2960,69.2470],
 ['Amir Temur xiyoboni','park',41.3111,69.2797],['Ekopark','park',41.3120,69.2960],["Botanika bog'i",'park',41.3440,69.3140],
 ['Tashkent City Park','park',41.3156,69.2486],["Alisher Navoiy milliy bog'i",'park',41.3010,69.2440],['Anhor Lokomotiv parki','park',41.3200,69.2640],
 ['Chorsu bozori','joy',41.3268,69.2352],['Minor masjidi','joy',41.3378,69.2756],['Toshkent teleminorasi','joy',41.3456,69.2847],['Magic City','joy',41.3040,69.2455]
].map(p=>({name:p[0],type:p[1],lat:p[2],lng:p[3]}));

const AVC=['#E8731A','#2F7BF0','#0A9C8F','#8A56E8','#E0457B','#1E9E63','#C28A00','#5E6E7C'];

const at=h=>{const d=new Date(Date.now()+h*36e5);d.setMinutes(d.getMinutes()<30?30:60,0,0);return d};
const seed=(id,c,title,pl,h,need,people,host,level,note)=>{const p=place(pl);return{id,cat:c,title,place:pl,lat:p.lat,lng:p.lng,when:at(h),need,people,host,level,note}};
const SEED=[];
const PAST=[];

/* ---------- state ---------- */
const S={
 user:null,uid:null,
 loc:store.get('loc',null),
 joined:new Set(),
 events:[],
 chats:{}, f:{cat:null,day:'all',q:''}, draft:null, stack:[], route:{name:'welcome'}, sel:null, hist:'up', mapQ:''
};
const save=()=>{};

const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'], WD=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dayDiff=d=>Math.round((sod(d)-sod(new Date()))/864e5);
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fmtDay=d=>{const n=dayDiff(d);return n===0?'Bugun':n===1?'Ertaga':n===-1?'Kecha':`${d.getDate()}-${MON[d.getMonth()]}`};
const fmtWhen=d=>`${fmtDay(d)}, ${hm(d)}`;
const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtKm=k=>k<1?`${Math.round(k*100)*10} m`:`${k.toFixed(1)} km`;
const dist=e=>S.loc?km(S.loc,e):0;
const nearest=(lat,lng,type)=>{let b=null,bd=1e9;for(const p of PLACES){if(type&&p.type!==type)continue;const d=km({lat,lng},p);if(d<bd){bd=d;b=p}}return{p:b,d:bd}};
const placeLabel=(lat,lng)=>{const n=nearest(lat,lng);return n.d<.35?n.p.name:`${n.p.name} yaqinida`};

/* ---------- toast / sheet ---------- */

/* ---------- location ---------- */
function setLoc(lat,lng,demo){S.loc={lat,lng,name:nearest(lat,lng,'tuman').p.name,demo:!!demo};store.set('loc',S.loc)}
function locate(done){
  const fb=()=>{setLoc(41.3647,69.2885,true);toast('GPS olinmadi. Demo joylashuv: Yunusobod');done&&done()};
  try{
    if(!navigator.geolocation)return fb();
    navigator.geolocation.getCurrentPosition(p=>{
      const {latitude:lat,longitude:lng}=p.coords;
      if(km({lat,lng},CITY)>60)return fb();
      setLoc(lat,lng,false);toast(`Joylashuv aniqlandi: ${S.loc.name}`);done&&done();
    },fb,{enableHighAccuracy:true,timeout:7000,maximumAge:60000});
  }catch(e){fb()}
}

/* ---------- map ---------- */
const maps=[];
class MapView{
  constructor(el,o={}){
    this.el=el;this.o=o;this.c={lat:o.lat??CITY.lat,lng:o.lng??CITY.lng};this.z=o.z??12;this.pins=[];this.ptr=new Map();
    el.classList.add('mapv');if(o.still)el.classList.add('still');
    this.cv=document.createElement('canvas');this.layer=document.createElement('div');this.layer.className='pins';
    this.meEl=document.createElement('div');this.meEl.className='pin';this.meEl.innerHTML='<div class="me-dot"></div>';this.meEl.hidden=true;
    this.layer.append(this.meEl);el.append(this.cv,this.layer);
    if(o.controls){const c=document.createElement('div');c.className='map-ctl';c.style.bottom=o.ctlBottom||'12px';
      c.innerHTML=`<button class="glass" aria-label="Kattalashtirish">${ic('plus',20)}</button><button class="glass" aria-label="Kichiklashtirish">${ic('minus',20)}</button><button class="glass" aria-label="Mening joyim">${ic('locate',20)}</button>`;
      const b=c.children;b[0].onclick=()=>this.fly(this.c.lat,this.c.lng,this.z+1);b[1].onclick=()=>this.fly(this.c.lat,this.c.lng,this.z-1);
      b[2].onclick=()=>{if(S.loc)this.fly(S.loc.lat,S.loc.lng,14)};el.append(c)}
    if(!o.still)this.bind();
    this.ro=new ResizeObserver(()=>this.resize());this.ro.observe(el);this.resize();maps.push(this);
  }
  destroy(){this.ro.disconnect();cancelAnimationFrame(this.raf)}
  resize(){const d=Math.min(2,devicePixelRatio||1);this.w=this.el.clientWidth;this.h=this.el.clientHeight;if(!this.w||!this.h)return;
    this.cv.width=this.w*d;this.cv.height=this.h*d;this.d=d;this.draw()}
  get s(){return 256*Math.pow(2,this.z)/360}
  xy(lat,lng){const s=this.s;return[this.w/2+(lng-this.c.lng)*s,this.h/2-(lat-this.c.lat)*s*KY]}
  colors(){if(this.col)return this.col;const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
    return this.col={land:g('--map-land'),road:g('--map-road'),road2:g('--map-road2'),water:g('--map-water'),park:g('--map-park'),label:g('--map-label')}}
  line(x,pts,w,col){x.beginPath();pts.forEach((p,i)=>{const[a,b]=this.xy(p[0],p[1]);i?x.lineTo(a,b):x.moveTo(a,b)});x.lineWidth=w;x.strokeStyle=col;x.stroke()}
  draw(){
    if(!this.w)return;const x=this.cv.getContext('2d'),c=this.colors(),s=this.s;
    x.setTransform(this.d,0,0,this.d,0,0);x.lineCap='round';x.lineJoin='round';
    x.fillStyle=c.land;x.fillRect(0,0,this.w,this.h);
    // local street grid (stylised)
    if(this.z>=11.6){const step=this.z>=13.6?.004:.008,th=.35,co=Math.cos(th),si=Math.sin(th),R=.3;
      const P=(u,v)=>[CITY.lat+(u*si+v*co)/KY,CITY.lng+(u*co-v*si)];
      x.beginPath();for(let d=-R;d<=R;d+=step){let a=this.xy(...P(d,-R)),b=this.xy(...P(d,R));x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);
        a=this.xy(...P(-R,d));b=this.xy(...P(R,d));x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1])}
      x.lineWidth=this.z>=13.6?2:1;x.strokeStyle=c.road2;x.stroke()}
    // parks
    x.fillStyle=c.park;for(const p of PLACES)if(p.type==='park'){const[a,b]=this.xy(p.lat,p.lng);x.beginPath();x.ellipse(a,b,s*.0052,s*.0044,.4,0,7);x.fill()}
    // water
    this.line(x,[[41.39,69.262],[41.37,69.263],[41.345,69.261],[41.327,69.268],[41.312,69.262],[41.298,69.255],[41.28,69.262],[41.255,69.27],[41.22,69.262]],Math.max(3,s*.0011),c.water);
    this.line(x,[[41.40,69.47],[41.36,69.42],[41.30,69.385],[41.25,69.345],[41.20,69.30],[41.15,69.25]],Math.max(5,s*.0026),c.water);
    // major roads
    const W=Math.max(2.5,s*.0007);
    const ring=(rx,ry,w)=>{const[a,b]=this.xy(41.305,69.275);x.beginPath();x.ellipse(a,b,rx*s,ry*s*KY,-.2,0,7);x.lineWidth=w;x.strokeStyle=c.road;x.stroke()};
    ring(.105,.066,W*1.5);ring(.036,.024,W);
    for(const p of PLACES)if(p.type==='tuman'){const k=1.7;this.line(x,[[CITY.lat,CITY.lng],[CITY.lat+(p.lat-CITY.lat)*k,CITY.lng+(p.lng-CITY.lng)*k]],W,c.road)}
    // labels
    x.textAlign='center';x.fillStyle=c.label;
    if(this.z>=10.8){x.font='600 11px Onest,system-ui,sans-serif';for(const p of PLACES)if(p.type==='tuman'){const[a,b]=this.xy(p.lat,p.lng);x.fillText(p.name.toUpperCase(),a,b+4)}}
    if(this.z>=12.6){x.font='500 11px Onest,system-ui,sans-serif';for(const p of PLACES)if(p.type!=='tuman'){const[a,b]=this.xy(p.lat,p.lng);
      x.beginPath();x.arc(a,b,2.5,0,7);x.fill();x.fillText(p.name,a,b+16)}}
    for(const p of this.pins){const[a,b]=this.xy(p.lat,p.lng);p.el.style.transform=`translate(${a}px,${b}px)`}
    if(this.me){const[a,b]=this.xy(this.me.lat,this.me.lng);this.meEl.style.transform=`translate(${a}px,${b}px)`}
  }
  setMe(l){this.me=l;this.meEl.hidden=!l;this.draw()}
  setPins(list,onTap){for(const p of this.pins)p.el.remove();this.pins=list.map(e=>{const c=cat(e.cat),el=document.createElement('div');el.className='pin';el.dataset.id=e.id;
      el.innerHTML=`<button class="pin-b" style="--c:${c.c}" aria-label="${esc(e.title)}"><span>${c.e}</span>${left(e)?`<b>${left(e)}</b>`:''}</button>`;
      if(onTap)el.firstChild.onclick=()=>onTap(e);this.layer.append(el);return{lat:e.lat,lng:e.lng,el,id:e.id}});this.draw()}
  select(id){for(const p of this.pins)p.el.classList.toggle('sel',p.id===id)}
  clamp(){this.z=Math.max(10.3,Math.min(16,this.z));this.c.lat=Math.max(41.1,Math.min(41.5,this.c.lat));this.c.lng=Math.max(69,Math.min(69.55,this.c.lng))}
  fly(lat,lng,z=this.z){cancelAnimationFrame(this.raf);const a={...this.c,z:this.z},t0=performance.now(),T=matchMedia('(prefers-reduced-motion:reduce)').matches?1:420;
    const f=t=>{let k=Math.min(1,(t-t0)/T);k=1-Math.pow(1-k,3);this.c.lat=a.lat+(lat-a.lat)*k;this.c.lng=a.lng+(lng-a.lng)*k;this.z=a.z+(z-a.z)*k;this.clamp();this.draw();
      if(k<1)this.raf=requestAnimationFrame(f);else this.o.onMove&&this.o.onMove(this.c)};this.raf=requestAnimationFrame(f)}
  bind(){const el=this.el,P=this.ptr;
    el.addEventListener('pointerdown',e=>{if(e.target.closest('.pin-b,.map-ctl'))return;try{el.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(this.raf)});
    el.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
      if(P.size===1){const s=this.s;this.c.lng-=(e.clientX-p.x)/s;this.c.lat+=(e.clientY-p.y)/(s*KY)}
      else if(P.size===2){const o=[...P.entries()].find(v=>v[0]!==e.pointerId)[1],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d0>0)this.z+=Math.log2(d1/d0)}
      p.x=e.clientX;p.y=e.clientY;this.clamp();this.draw();this.o.onDrag&&this.o.onDrag()});
    const up=e=>{if(P.delete(e.pointerId)&&!P.size)this.o.onMove&&this.o.onMove(this.c)};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    el.addEventListener('wheel',e=>{e.preventDefault();this.z-=e.deltaY*.003;this.clamp();this.draw();this.o.onMove&&this.o.onMove(this.c)},{passive:false});
  }
}

  const ps=PLACES.map((p,i)=>[p,i]).filter(x=>x[0].name.toLowerCase().includes(q)).slice(0,6),
        es=withEvents?upcoming().filter(e=>(e.title+' '+cat(e.cat).n).toLowerCase().includes(q)).slice(0,4):[];
  box.innerHTML=es.map(e=>`<button type="button" data-act="pick-ev" data-id="${e.id}"><span style="font-size:22px">${cat(e.cat).e}</span><span><b>${esc(e.title)}</b><span class="tiny">${fmtWhen(e.when)} · ${esc(e.place)}</span></span></button>`).join('')
    +ps.map(x=>`<button type="button" data-act="pick-place" data-v="${x[1]}">${ic('pin',20)}<span><b>${esc(x[0].name)}</b><span class="tiny">${x[0].type==='tuman'?'Tuman':x[0].type==='park'?"Bog'":x[0].type==='sport'?'Sport inshooti':'Mashhur joy'}</span></span></button>`).join('')
    ||`<p class="muted" style="padding:12px">"${esc(q)}" bo'yicha joy topilmadi. Xaritani surib, joyni qo'lda belgilang.</p>`;
  box.hidden=false;
}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){A[a.dataset.act](a,e);return}
  const g=e.target.closest('[data-go]');if(g){closeSheet();go(g.dataset.go,g.dataset.id)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;F[f]&&F[f]()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q-home'){S.f.q=t.value;refreshFeed()}
  else if(t.id==='q-map')placeResults(t.value,$('#map-res'),true)
  else if(t.id==='c-q')placeResults(t.value,$('#c-res'),false)
  else if(t.id==='c-title'){delete t.dataset.auto;S.draft.title=t.value}
  else if(t.id==='c-note')S.draft.note=t.value
  else if(t.id==='c-time')S.draft.time=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- boot ---------- */
const th=store.get('theme','sys');if(th!=='sys')document.documentElement.dataset.theme=th;
const route0=()=>{const h=(location.hash||'').slice(1),i=h.indexOf('-');return[i<0?h:h.slice(0,i),i<0?'':h.slice(i+1)]};
(async()=>{
  if(!SB){S.route={name:'setup'};render();return}
  SB.auth.onAuthStateChange((evt,sess)=>{if(evt==='PASSWORD_RECOVERY'&&sess)setTimeout(async()=>{await enter(sess.user);if(!S.loc)setLoc(41.3647,69.2885,true);go('home');recoverySheet()},0)});
  const {data:{session}}=await SB.auth.getSession();
  if(session)await enter(session.user);
  const [hn,hid]=route0();
  if(S.user){if(!S.loc)setLoc(41.3647,69.2885,true);S.route=P[hn]&&!['welcome','login','register','setup'].includes(hn)?{name:hn,id:hid}:{name:'home'}}
  else S.route={name:['login','register'].includes(hn)?hn:'welcome'};
  render();
  setInterval(async()=>{if(!S.uid||document.hidden||!['home','map'].includes(S.route.name))return;
    if(!await refresh())return;if(S.route.name==='home')refreshFeed();else if(P.map.pins)P.map.pins()},30000);
})();
})();
</script>

    });
  });
}
